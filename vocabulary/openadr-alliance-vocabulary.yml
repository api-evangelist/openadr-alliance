spec_version: 3.1.1
description: 'Controlled vocabulary of the OpenADR 3 protocol: the addressable object types, the roles
  the authorization model separates, and every enumerated payload type, attribute key, reading type, and
  unit the Alliance publishes as normative enumeration schemas alongside the OpenAPI contract.'
groups:
- id: objects
  title: OpenADR 3 objects
  description: Core addressable objects and value structures of the OpenADR 3 information model.
  source: openapi/openadr-3-1-1-openapi.yaml
  terms:
  - term: program
    definition: Server provided representation of program
  - term: event
    definition: Server provided representation of event
  - term: report
    definition: Server provided representation of report
  - term: subscription
    definition: Server provided representation of subscription
  - term: ven
    definition: Server provided representation of ven
  - term: resource
    definition: Server provided representation of resource
  - term: interval
    definition: An object defining a temporal window and a list of valuesMaps. if intervalPeriod present
      may set temporal aspects of interval or override event.intervalPeriod.
  - term: intervalPeriod
    definition: Defines temporal aspects of intervals. A start of "0001-01-01" or "0001-01-01T00:00:00"
      may indicate 'now'. See User Guide. A duration of "P9999Y" may indicate infinity. See User Guide.
      A randomizeStart indicates absolute range of client applied offset to start. See User Guide.
  - term: valuesMap
    definition: Represents one or more values associated with a type. See enumerations in Definitions
      for defined string values, or use privately defined strings
  - term: point
    definition: A pair of floats typically used as a point on a 2 dimensional grid.
  - term: eventPayloadDescriptor
    definition: Contextual information used to interpret event valuesMap values. E.g. a PRICE payload
      simply contains a price value, an associated descriptor provides necessary context such as units
      and currency.
  - term: reportPayloadDescriptor
    definition: Contextual information used to interpret report payload values. E.g. a USAGE payload simply
      contains a usage value, an associated descriptor provides necessary context such as units and data
      quality.
  - term: reportDescriptor
    definition: An object that may be used to request a report from a VEN.
  - term: notification
    definition: VTN generated object included in request to subscription callbackUrl.
  - term: target
    definition: User generated target string.
  - term: objectMetadata
    definition: metadata common to all addressable objects. Values provided by VTN on object creation.
