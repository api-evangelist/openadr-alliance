honesty:
  fabricated: false
  notes:
    - No host, endpoint, scope, or specification was invented.
    - Every URL in apis.yml was probed and returned a live 200 on 2026-07-27.
    - >-
      No baseURL is claimed for OpenADR 3 because none exists — the protocol is
      implementer-hosted and the specs' servers blocks point at localhost and a
      SwaggerHub mock.
    - >-
      The harvested specs came from a public third-party mirror, not from
      openadr.org. That provenance is stated on every file rather than being
      presented as an Alliance-hosted download.
    - >-
      The open WordPress REST API at products.openadr.org was found, probed, and
      deliberately excluded from apis.yml because it returns no Alliance data.
