protocol_level_discovery:
  note: >-
    OpenADR 3.1 does define its own in-protocol discovery surface in place of
    /.well-known/ metadata. These are operations on an implementer's VTN, not on
    an Alliance host, so they cannot be probed here — but they are the OpenADR
    analogue of RFC 8414 authorization-server metadata and of an event catalog.
  operations:
  - operationId: getAuthServerInfo
    path: GET /auth/server
    returns: authServerInfo — the URL of the VTN token endpoint
    analogue: RFC 8414 /.well-known/oauth-authorization-server
  - operationId: listAllNotifiers
    path: GET /notifiers
    returns: notifiersResponse — which notifier bindings the VTN supports (WEBHOOK always, MQTT optionally, with broker URIs, serialization and authentication)
    analogue: event/notification transport discovery
  - operationId: listAllMqttNotifierTopicsPrograms
    path: GET /notifiers/mqtt/topics/programs
    returns: notifierTopicsResponse — VTN-assigned MQTT topic names per operation
    analogue: channel catalog
