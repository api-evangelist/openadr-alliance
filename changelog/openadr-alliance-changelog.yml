- version: 3.1.1
  status: development
  artifacts: [openadr3.yaml, Definition.md, User_Guide.md, changeLog.md, enumerations/]
  breaking: false
  highlights:
  - The 3.1.1 changeLog.md lists no changes of its own yet — it restates the 3.1.0 delta.
  - >-
    Editorial/tooling cleanup landed upstream (commits 426c867 "Consistent indentation" and
    417c53b "correct Redocly and yamllint warnings").
  - >-
    Two real contract fixes are observable against 3.1.0: the read_bl scope, which 3.1.0
    operations already required but never declared, is now declared in the
    clientCredentials flow scopes map; and the document-level tags[] block is now present,
    declaring all nine tag groups that operations were already using.
  operations: 45
