description: >-
  OpenADR 3 specification change log. The Alliance ships a changeLog.md inside each
  specification release from 3.1.0 onward and a machine-readable VERSIONS.yaml in the
  public Apache-2.0 copy of the release. There is no dated web changelog and no
  changelog for the 3.0.x releases — the earliest two versions shipped the OpenAPI YAML
  alone. Issue numbers reference the canonical (membership-gated) oadr3-org/specification
  repository.
scheme: semver
current_version: 3.1.1
current_status: development
scope: >-
  These are specification releases, not deployments. The Alliance operates no hosted API,
  so a version change here propagates only when an implementer ships a new VTN or VEN.
