asyncapi: 3.0.0
info:
  title: OpenADR 3 Object Operation Notifications
  version: 3.1.1
  description: 'Event surface of the OpenADR 3 protocol, derived from the OpenADR 3.1.1 OpenAPI contract

    and the Alliance-published notifications design document. The OpenADR Alliance publishes no

    AsyncAPI document of its own; this one is an API Evangelist derivation and is NOT a

    normative Alliance artifact.


    Two notifier bindings exist. WEBHOOK is mandatory for every VTN: a client creates a

    subscription carrying a callbackUrl, and the VTN POSTs a notification object to it. MQTT was

    added in 3.1.0 and is optional: the client discovers broker URIs and authentication via

    GET /notifiers, then discovers VTN-assigned topic names via the GET /notifiers/mqtt/topics/*

    operations. Topic names are NOT fixed by the specification — they are assigned per client so

    that a VEN only receives notifications for objects it is authorized to see (object privacy).

    The channel addresses below therefore use runtime-resolved placeholders rather than invented

    literal topic strings.

    '
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  externalDocs:
    description: OpenADR3 Object Operation Notifications via Additional Protocols (v1.0.0, 2026-03-15)
    url: https://github.com/grid-coordination/openadr3-specification/blob/main/doc/OpenADR3%20Object%20Operation%20Notifications%20via%20Additional%20Protocols.md
defaultContentType: application/json
servers:
  vtn-webhook:
    host: implementer-hosted
    protocol: https
    description: The VTN that publishes notifications by POSTing to a subscription callbackUrl. Each implementer
      hosts its own; the Alliance hosts none.
  vtn-mqtt-broker:
    host: broker.vtn.example.com
    protocol: mqtts
    description: MQTT broker advertised by the VTN in the MQTT notifier binding (mqttNotifierBindingObject.URIS).
      Discovered at runtime via GET /notifiers; the host shown is the placeholder pattern used in the specification
      example, not a real broker.
    security:
    - $ref: '#/components/securitySchemes/mqttOauth2Bearer'
    - $ref: '#/components/securitySchemes/mqttCertificate'
    - $ref: '#/components/securitySchemes/mqttAnonymous'
channels:
  webhookCallback:
    address: '{callbackUrl}'
    title: Subscription webhook callback
    description: The callbackUrl registered on each subscription.objectOperations[] entry. Declared in the OpenAPI
      as the notifyEvent callback on POST /subscriptions with security [{}]. The subscriber may supply a bearerToken
      alongside the callbackUrl, which the VTN is expected to present on its requests, but that token is not modelled
      on the callback operation itself and there is no payload signature or replay defence.
    servers:
    - $ref: '#/servers/vtn-webhook'
    parameters:
      callbackUrl:
        description: Absolute URL supplied by the subscriber in subscription.objectOperations[].callbackUrl.
    messages:
      objectOperationNotification:
        $ref: '#/components/messages/objectOperationNotification'
  mqttObjectTopic:
    address: '{topic}'
    title: MQTT object-operation topic
    description: A VTN-assigned MQTT topic carrying notifications for one object type and one operation (or ALL).
      Resolve the concrete name from notifierTopicsResponse.topics.{CREATE|UPDATE|DELETE|ALL} returned by the matching
      GET /notifiers/mqtt/topics/* operation. The specification example pattern is "{objectType}s/create", "{objectType}s/update",
      "{objectType}s/delete", "{objectType}s/+", but a VTN may name topics however it likes and MAY scope them per
      VEN.
    servers:
    - $ref: '#/servers/vtn-mqtt-broker'
    parameters:
      topic:
        description: Runtime-resolved topic name from the notifier topics endpoints.
    messages:
      objectOperationNotification:
        $ref: '#/components/messages/objectOperationNotification'
operations:
  receiveWebhookNotification:
    action: receive
    channel:
      $ref: '#/channels/webhookCallback'
    title: Receive a notification on a subscription callback URL
    description: The VTN POSTs a notification to the subscriber. The subscriber returns 200 to accept it, or a problem
      document on 400.
    bindings:
      http:
        method: POST
    messages:
    - $ref: '#/channels/webhookCallback/messages/objectOperationNotification'
  receiveMqttNotification:
    action: receive
    channel:
      $ref: '#/channels/mqttObjectTopic'
    title: Receive a notification from an MQTT notifier topic
    description: The subscriber consumes JSON-serialized notifications from a VTN-assigned topic. Target-based filtering
      is not available on this binding; object privacy is enforced by VEN-scoped topics instead.
    messages:
    - $ref: '#/channels/mqttObjectTopic/messages/objectOperationNotification'
components:
  messages:
    objectOperationNotification:
      name: objectOperationNotification
      title: Object operation notification
      summary: VTN generated object included in request to subscription callbackUrl.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/notification'
  securitySchemes:
    mqttAnonymous:
      type: userPassword
      description: mqttNotifierAuthenticationAnonymous — the VTN broker accepts anonymous connections.
    mqttOauth2Bearer:
      type: httpApiKey
      name: Authorization
      in: user
      description: mqttNotifierAuthenticationOauth2BearerToken — the same OAuth 2.0 client-credentials JWT used
        on the REST surface.
    mqttCertificate:
      type: X509
      description: mqttNotifierAuthenticationCertificate — client certificate, consistent with the OpenADR Alliance
        PKI.
  schemas:
    notification:
      type: object
      description: 'VTN generated object included in request to subscription callbackUrl.

        '
      required:
      - objectType
      - operation
      - object
      properties:
        objectType:
          $ref: '#/components/schemas/objectTypes'
        operation:
          type: string
          description: the operation on on object that triggered the notification.
          example: UPDATE
          enum:
          - CREATE
          - READ
          - UPDATE
          - DELETE
        object:
          type: object
          description: the object that is the subject of the notification.
          oneOf:
          - $ref: '#/components/schemas/program'
          - $ref: '#/components/schemas/report'
          - $ref: '#/components/schemas/event'
          - $ref: '#/components/schemas/subscription'
          - $ref: '#/components/schemas/ven'
          - $ref: '#/components/schemas/resource'
          discriminator:
            propertyName: objectType
          example:
            id: object-999
            objectType: PROGRAM
            createdDateTime: '2023-06-15T09:30:00Z'
            modificationDateTime: '2023-06-15T09:30:00Z'
            programName: ResTOU
        targets:
          type: array
          description: A list of targets.
          items:
            $ref: '#/components/schemas/target'
          nullable: true
    objectTypes:
      type: string
      description: Types of objects addressable through API.
      example: EVENT
      enum:
      - PROGRAM
      - EVENT
      - REPORT
      - SUBSCRIPTION
      - VEN
      - RESOURCE
    program:
      type: object
      description: Server provided representation of program
      allOf:
      - $ref: '#/components/schemas/objectMetadata'
      - $ref: '#/components/schemas/programRequest'
    programRequest:
      type: object
      description: Client provided description of program
      required:
