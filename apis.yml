apis:
- aid: openadr-alliance:openadr-3-api
  name: OpenADR 3 API
  description: >-
    OpenADR 3 is the RESTful third generation of the OpenADR protocol, defined
    in full by a single OpenAPI 3.0 document published by the OpenADR Alliance.
    It supports energy-retailer-to-energy-customer demand response programs
    through operations to create, update, delete, and search programs, events,
    reports, subscriptions, VENs (Virtual End Nodes), and VEN resources, plus an
    /auth/token endpoint. Version 3.1.0 adds MQTT notifier topics, VEN-scoped
    topics for object privacy, and VTN discovery. Security is OAuth 2.0 client
    credentials with JWT bearer tokens and role-scoped grants that separate what
    a Business Logic (BL/VTN) client may write from what a VEN may write. This
    is a protocol contract, not an Alliance-hosted service — every implementer
    (a utility, aggregator, or vendor VTN) stands up its own base URL, so no
    single baseURL exists. The specification documents themselves are
    distributed by the Alliance through a registration form; the OpenAPI files
    harvested here came from a public Apache-2.0 copy of the Alliance release.
  humanURL: https://www.openadr.org/specification
