aid: openadr-alliance
url: https://raw.githubusercontent.com/api-evangelist/openadr-alliance/refs/heads/main/apis.yml
name: OpenADR Alliance
kind: company
description: 'The OpenADR Alliance is a San Ramon, California mutual-benefit membership corporation
  that develops, certifies, and promotes OpenADR, the open information-exchange model utilities,
  ISOs/RTOs, aggregators, and device makers use to automate demand response and dispatch distributed
  energy resources. It is a standards body, not a service operator: it publishes the OpenADR
  2.0a/2.0b profile specifications (approved by the IEC as IEC/PAS 62746-10-1) and OpenADR 3.0/3.1,
  which abandoned the SOAP-era design and is now defined entirely by an OpenAPI 3.0 contract
  covering programs, events, reports, subscriptions, VENs, and resources, secured with OAuth
  2.0 client credentials. It also runs the OpenADR and EcoPort (CTA-2045-B) certification programmes
  and their public certified-product databases. Its API posture is honest but narrow: the OpenADR
  3 OpenAPI is a genuine, parseable machine-readable contract, and the specifications are license-free,
  but the Alliance itself operates no developer portal, no api./developer./docs. subdomain,
  and no hosted API — its canonical specification repository (github.com/oadr3-org) has zero
  public repositories and requires membership, and the public route to the spec is a registration
  form that emails download links under terms and conditions. It publishes no consumer energy
  data and no open grid or market data; it defines the protocol that other parties implement.
  Home market is the United States, with adoption across Europe, Japan, Korea, and Australia.'
