  cost: free
  license: license-free but copyright OpenADR Alliance; terms and conditions apply
  gate: registration form at https://www.openadr.org/specification-download; download links emailed
  note: >-
    The canonical repository (github.com/oadr3-org) is membership-gated with zero public
