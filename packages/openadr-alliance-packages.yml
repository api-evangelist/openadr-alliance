alliance_position: >-
  The Alliance sells implementation support rather than shipping code: a free
  30-minute consultation for new members, then paid 2h ($450), 5h ($1,050) and
  10h ($2,000) implementation-support packages, plus a members-only OpenADR 3
  Reference Implementation. See https://www.openadr.org/get-implementation-help.
