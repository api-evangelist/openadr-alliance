summary: >-
  The OpenADR Alliance publishes NO first-party client libraries. Its canonical
  GitHub organisation (github.com/oadr3-org) has zero public repositories, and
  the OpenADR 3 Reference Implementation is described on the Alliance site as
  available to members only. Every package below is third-party — built by
  implementers, national labs, or vendors against the Alliance specification —
  so none carries official: true. Recorded here because they are the real
  on-ramp for developers, and because the absence of a first-party SDK is itself
  a finding about this provider's developer surface.
